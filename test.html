<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言切换测试</title>
</head>
<body>
    <h1>语言切换功能测试</h1>

    <button id="langSwitch">English</button>

    <h2 data-i18n="nav.home">首页</h2>
    <p data-i18n="about.title">关于我</p>
    <p data-i18n="projects.contribution">个人贡献</p>

    <script>
        // 简化的国际化类
        class SimpleI18n {
            constructor() {
                this.currentLang = 'zh';
                this.translations = {
                    zh: {
                        'nav.home': '首页',
                        'about.title': '关于我',
                        'projects.contribution': '个人贡献'
                    },
                    en: {
                        'nav.home': 'Home',
                        'about.title': 'About Me',
                        'projects.contribution': 'My Contribution'
                    }
                };
            }

            updateUI() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    const text = this.translations[this.currentLang][key];
                    if (text) {
                        el.textContent = text;
                    }
                });

                const button = document.getElementById('langSwitch');
                button.textContent = this.currentLang === 'zh' ? 'English' : '中文';
            }

            toggleLanguage() {
                this.currentLang = this.currentLang === 'zh' ? 'en' : 'zh';
                this.updateUI();
                console.log('切换到:', this.currentLang);
            }
        }

        const i18n = new SimpleI18n();

        document.getElementById('langSwitch').addEventListener('click', () => {
            i18n.toggleLanguage();
        });

        console.log('页面加载完成');
    </script>
</body>
</html>
